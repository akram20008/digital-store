<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الدفع</title>

<style>
body{
  margin:0;
  font-family:Tajawal,Tahoma;
  background:#020617;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:94%;
  max-width:460px;
  background:#020617;
  border:1px solid #1e293b;
  border-radius:22px;
  padding:22px;
  animation:fade .6s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(30px)}
}

h2{text-align:center;margin-bottom:16px}

.info{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
}

.pay{
  border:1px solid #1e293b;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.3s;
}

.pay.active{
  border-color:#4ade80;
  background:#022c22;
}

.details{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#020617;
  border:1px dashed #334155;
  font-size:14px;
  display:none;
  animation:open .3s ease;
}

@keyframes open{
  from{opacity:0;transform:scale(.95)}
}

.upload{
  margin-top:14px;
}

button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.back{
  margin-top:12px;
  text-align:center;
  color:#93c5fd;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>💳 تفاصيل الدفع</h2>

  <div class="info">
    📦 الخدمة: <b id="serviceName"></b><br>
    💰 السعر: <b>$<span id="servicePrice"></span></b>
  </div>

  <div class="pay" onclick="selectPay(this,'بنك فلسطين')">
    🏦 بنك فلسطين
    <div class="details">
      اسم الحساب: محمد أحمد<br>
      رقم الحساب: 123456789
    </div>
  </div>

  <div class="pay" onclick="selectPay(this,'محفظة إلكترونية')">
    📱 محفظة إلكترونية
    <div class="details">
      اسم المحفظة: محمد أحمد<br>
      الرقم: 0590000000
    </div>
  </div>

  <div class="pay" onclick="selectPay(this,'PayPal')">
    💳 PayPal
    <div class="details">
      البريد: payments@store.com
    </div>
  </div>

  <div class="pay" onclick="selectPay(this,  جوال بي')">
    📞 جوال باي
    <div class="details">
      الاسم: محمد أحمد<br>
      الرقم: 0560000000
    </div>
  </div>

  <div class="upload">
    📷 رفع صورة إثبات الدفع
    <input type="file" id="proof" accept="image/*">
  </div>

  <button onclick="confirmOrder()">تأكيد الطلب</button>
  <div class="back" onclick="location.href='index.html'">⬅ الرجوع للمتجر</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAkVr83u7Oxy-lWvqWlCqyVjIS34J-FRd4",
  authDomain:"digital-store-268a9.firebaseapp.com",
  projectId:"digital-store-268a9",
  storageBucket:"digital-store-268a9.appspot.com"
});

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = null;
let paymentMethod = "";

auth.onAuthStateChanged(user=>{
  currentUser = user;
});

serviceName.textContent = localStorage.getItem("serviceName") || "-";
servicePrice.textContent = localStorage.getItem("servicePrice") || "0";

function selectPay(el,method){
  document.querySelectorAll(".pay").forEach(p=>{
    p.classList.remove("active");
    p.querySelector(".details").style.display="none";
  });
  el.classList.add("active");
  el.querySelector(".details").style.display="block";
  paymentMethod = method;
}

async function confirmOrder(){
  if(!currentUser){
    alert("سجل دخولك أولاً");
    return;
  }

  const file = proof.files[0];
  if(!paymentMethod || !file){
    alert("اختر طريقة الدفع وارفع الصورة");
    return;
  }

  const ref = storage.ref("proofs/"+Date.now()+"_"+file.name);
  await ref.put(file);
  const imageURL = await ref.getDownloadURL();

  await db.collection("orders").add({
    service: localStorage.getItem("serviceName"),
    price: localStorage.getItem("servicePrice"),
    paymentMethod,
    proofImage: imageURL,
    email: currentUser.email,
    status:"بانتظار المراجعة",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("✅ تم إرسال الطلب");
  location.href="orders.html";
}
</script>

</body>
</html>
