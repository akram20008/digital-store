<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تفاصيل الدفع</title>

<style>
body{
  margin:0;
  font-family:Tajawal,Tahoma;
  background:#020617;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:94%;
  max-width:460px;
  background:#020617;
  border:1px solid #1e293b;
  border-radius:22px;
  padding:22px;
  animation:fade .6s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(30px)}
}

h2{text-align:center;margin-bottom:16px}

.info{
  border:1px solid #1e293b;
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
}

.pay{
  border:1px solid #1e293b;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.3s;
}

.pay:hover{ transform:scale(1.02); }

.pay.active{
  border-color:#4ade80;
  background:#022c22;
  box-shadow:0 0 12px #4ade80aa;
}

.details{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#020617;
  border:1px dashed #334155;
  font-size:14px;
  display:none;
  animation:open .3s ease;
}

@keyframes open{
  from{opacity:0;transform:scale(.9)}
}

.upload{
  margin-top:14px;
}

button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
  position:relative;
}

button:hover{ transform:scale(1.03); }
button:active{ transform:scale(.96); }

.progress-bar{
  position:absolute;
  bottom:0;
  left:0;
  height:4px;
  background:#4ade80;
  width:0%;
  border-radius:0 0 16px 16px;
  transition:width 0.2s ease;
}

.back{
  margin-top:12px;
  text-align:center;
  color:#93c5fd;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>💳 تفاصيل الدفع</h2>

  <div class="info">
    📦 الخدمة: <b id="serviceName"></b><br>
    💰 السعر: <b>$<span id="servicePrice"></span></b>
  </div>

  <div class="pay" onclick="selectPay(this,'بنك فلسطين')">
    🏦 بنك فلسطين
    <div class="details">
      اسم الحساب: محمد أحمد<br>
      رقم الحساب: 123456789
    </div>
  </div>

  <div class="pay" onclick="selectPay(this,'محفظة إلكترونية')">
    📱 محفظة إلكترونية
    <div class="details">
      الاسم: محمد أحمد<br>
      الرقم: 0590000000
    </div>
  </div>

  <div class="pay" onclick="selectPay(this,'PayPal')">
    💳 PayPal
    <div class="details">
      البريد: payments@store.com
    </div>
  </div>

  <div class="pay" onclick="selectPay(this,'جوال بي')">
    📞 جوال بي
    <div class="details">
      الاسم: محمد أحمد<br>
      الرقم: 0560000000
    </div>
  </div>

  <div class="upload">
    📷 رفع صورة إثبات الدفع
    <input type="file" id="proof" accept="image/*">
  </div>

  <button onclick="confirmOrder(this)">تأكيد الطلب
    <div class="progress-bar" id="progressBar"></div>
  </button>

  <div class="back" onclick="location.href='index.html'">
    ⬅ الرجوع للمتجر
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAkVr83u7Oxy-lWvqWlCqyVjIS34J-FRd4",
  authDomain:"digital-store-268a9.firebaseapp.com",
  projectId:"digital-store-268a9",
  storageBucket:"digital-store-268a9.appspot.com"
});

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let paymentMethod = "";

serviceName.textContent = localStorage.getItem("serviceName") || "-";
servicePrice.textContent = localStorage.getItem("servicePrice") || "0";

function selectPay(el,method){
  document.querySelectorAll(".pay").forEach(p=>{
    p.classList.remove("active");
    p.querySelector(".details").style.display="none";
  });
  el.classList.add("active");
  el.querySelector(".details").style.display="block";
  paymentMethod = method;
}

/* ✅ زر تأكيد الطلب مع شريط تحميل */
async function confirmOrder(btn){

  btn.disabled = true;
  const progressBar = document.getElementById("progressBar");
  btn.innerText = "جاري الإرسال...";
  btn.appendChild(progressBar);

  const user = auth.currentUser;

  if(!user){
    alert("سجل دخولك أولاً");
    btn.disabled = false;
    btn.innerText = "تأكيد الطلب";
    return;
  }

  if(!paymentMethod){
    alert("اختر طريقة الدفع");
    btn.disabled = false;
    btn.innerText = "تأكيد الطلب";
    return;
  }

  const file = document.getElementById("proof").files[0];

  if(!file){
    alert("ارفع صورة الإثبات");
    btn.disabled = false;
    btn.innerText = "تأكيد الطلب";
    return;
  }

  try{
    const ref = storage.ref("proofs/"+Date.now()+"_"+file.name);
    const uploadTask = ref.put(file);

    uploadTask.on('state_changed', snapshot=>{
      const percent = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
      progressBar.style.width = percent + "%";
    });

    await uploadTask;

    const imageURL = await ref.getDownloadURL();

    await db.collection("orders").add({
      service: localStorage.getItem("serviceName"),
      price: localStorage.getItem("servicePrice"),
      paymentMethod,
      proofImage: imageURL,
      email: user.email,
      status:"بانتظار المراجعة",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("✅ تم إرسال الطلب بنجاح");
    location.href="orders.html";

  }catch(e){
    console.error(e);
    alert("❌ حدث خطأ أثناء الإرسال");
    btn.disabled = false;
    btn.innerText = "تأكيد الطلب";
    progressBar.style.width = "0%";
  }
}
</script>

</body>
</html>
