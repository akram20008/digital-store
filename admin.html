<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة الأدمن</title>

<style>
body{
  margin:0;
  font-family:Tajawal,Tahoma;
  background:#020617;
  color:#fff;
}

header{
  padding:18px 24px;
  border-bottom:1px solid #1e293b;
  text-align:center;
  font-size:20px;
}

/* ===== أزرار ===== */
.admin-actions{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:18px 0;
  flex-wrap:wrap;
}

.action-btn{
  padding:12px 22px;
  border-radius:999px;
  text-decoration:none;
  color:#fff;
  background:#334155;
}

/* ===== إضافة خدمة ===== */
.add-box{
  max-width:900px;
  margin:20px auto;
  padding:20px;
  border:1px solid #1e293b;
  border-radius:22px;
}

.add-box input,
.add-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:14px;
  border:none;
}

.add-box button{
  padding:12px 20px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
}

/* ===== كروت ===== */
.container{
  max-width:1000px;
  margin:auto;
  padding:24px;
}

.card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
}

.badge{
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  background:#334155;
}

.btn{
  padding:6px 10px;
  border:none;
  border-radius:10px;
  margin-top:8px;
  cursor:pointer;
  font-size:12px;
}

.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#475569;color:#fff}

.proof img{
  width:100%;
  max-height:220px;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}

/* تكبير الصورة */
.lightbox{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.9);
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

.section-title{
  margin:30px 0 10px;
  font-size:18px;
}
</style>
</head>

<body>

<header>🛠 لوحة الأدمن</header>

<div class="admin-actions">
  <a href="index.html" class="action-btn">🏪 الرجوع للمتجر</a>
</div>

<!-- إضافة خدمة -->
<div class="add-box">
  <h3>➕ إضافة خدمة</h3>

  <input id="sName" placeholder="اسم الخدمة">
  <textarea id="sDetails" placeholder="تفاصيل الخدمة"></textarea>
  <input id="sPrice" type="number" placeholder="سعر الخدمة">
  <input id="sImage" placeholder="رابط صورة الخدمة">

  <button onclick="addService()">حفظ الخدمة</button>
</div>

<!-- عرض الخدمات -->
<div class="container">
  <div class="section-title">🧩 الخدمات</div>
  <div id="servicesBox"></div>
</div>

<!-- الطلبات -->
<div class="container">
  <div class="section-title">📦 الطلبات</div>
  <div id="orders"></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightImg">
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAkVr83u7Oxy-lWvqWlCqyVjIS34J-FRd4",
  authDomain:"digital-store-268a9.firebaseapp.com",
  projectId:"digital-store-268a9"
});

const auth = firebase.auth();
const db = firebase.firestore();

const ordersBox = document.getElementById("orders");
const servicesBox = document.getElementById("servicesBox");


// =========================
// إضافة خدمة
// =========================
function addService(){
  db.collection("services").add({
    name:sName.value,
    details:sDetails.value,
    price:sPrice.value,
    image:sImage.value,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  sName.value=sDetails.value=sPrice.value=sImage.value="";
}


// =========================
// عرض الخدمات + حذف + تعديل
// =========================
db.collection("services").onSnapshot(snap=>{
  servicesBox.innerHTML="";

  snap.forEach(doc=>{
    const s = doc.data();

    servicesBox.innerHTML+=`
      <div class="card">
        <b>${s.name}</b><br>
        ${s.details}<br>
        💰 $${s.price}<br>
        <img src="${s.image}" width="120"><br>

        <button class="btn gray" onclick="editService('${doc.id}','${s.name}','${s.details}','${s.price}','${s.image}')">✏️ تعديل</button>
        <button class="btn red" onclick="deleteService('${doc.id}')">🗑 حذف</button>
      </div>
    `;
  });
});

function deleteService(id){
  if(confirm("حذف الخدمة؟"))
    db.collection("services").doc(id).delete();
}

function editService(id,n,d,p,i){
  sName.value=n;
  sDetails.value=d;
  sPrice.value=p;
  sImage.value=i;

  deleteService(id);
}


// =========================
// الطلبات + قبول/رفض
// =========================
auth.onAuthStateChanged(user=>{
  if(!user) location.href="login.html";

  db.collection("orders")
  .orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    ordersBox.innerHTML="";

    snap.forEach(doc=>{
      const o = doc.data();

      ordersBox.innerHTML+=`
        <div class="card">
          <b>${o.service}</b>
          <span class="badge">${o.status || "قيد المراجعة"}</span><br>
          👤 ${o.email}<br>
          💰 $${o.price}

          ${o.proofImage ? `<div class="proof"><img src="${o.proofImage}" onclick="openImg('${o.proofImage}')"></div>` : ""}

          <button class="btn green" onclick="updateStatus('${doc.id}','مقبول')">✅ قبول</button>
          <button class="btn red" onclick="updateStatus('${doc.id}','مرفوض')">❌ رفض</button>
        </div>
      `;
    });
  });
});

function updateStatus(id,status){
  db.collection("orders").doc(id).update({status});
}


// =========================
// تكبير صورة
// =========================
function openImg(src){
  lightbox.style.display="flex";
  lightImg.src=src;
}
</script>

</body>
</html>
